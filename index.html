const fix = s => String(s).replace(/[’‘]/g, "'").replace(/[“”]/g, '"').trim();

function phoneticRepair(recognized, target) {
  if (!recognized || !target) return recognized;
  const userWords = recognized.split(/\s+/);
  const targetWords = target.toLowerCase().replace(/[^a-z0-9' ]/g, ' ').split(/\s+/).filter(Boolean);

  // Common Indian English / accent confusions → preferred form
  const accentMap = {
    // v / w
    'wery': 'very', 'bery': 'very', 'bery': 'very',
    'wen': 'when', 'vat': 'what', 'vere': 'where', 'vy': 'why',
    'vill': 'will', 'vant': 'want', 'vas': 'was', 'ver': 'were',
    // th → t / d
    'tink': 'think', 'tank': 'thank', 'tanks': 'thanks',
    'dis': 'this', 'dat': 'that', 'dese': 'these', 'dose': 'those',
    'der': 'there', 'den': 'then', 'dem': 'them',
    'tree': 'three', 'tirty': 'thirty', 'tousend': 'thousand',
    // r-related / retroflex
    'worries': 'worries', 'worring': 'worrying',
    // common verb / noun slips
    'batch': 'badge', 'badge': 'batch',
    'shoes': 'issues', 'shoe': 'issue',
    'cart': 'card', 'cord': 'card',
    'off': 'of', 'ov': 'of',
    'an': 'and', 'n': 'and',
    'da': 'the', 'de': 'the',
    'is': 'is', 'iss': 'is',
    'are': 'are', 'r': 'are',
    'going': 'going', 'goin': 'going',
    'coming': 'coming', 'comin': 'coming',
    'something': 'something', 'somting': 'something', 'someting': 'something',
    'nothing': 'nothing', 'noting': 'nothing',
    'everything': 'everything', 'everyting': 'everything',
    'manager': 'manager', 'manger': 'manager',
    'meeting': 'meeting', 'meting': 'meeting',
    'important': 'important', 'importent': 'important',
    'different': 'different', 'diferent': 'different',
    'because': 'because', 'becos': 'because', 'bcoz': 'because',
    'about': 'about', 'abot': 'about',
    'before': 'before', 'befor': 'before',
    'after': 'after', 'aftar': 'after',
    'people': 'people', 'pepal': 'people', 'peoples': 'people',
    'number': 'number', 'numbar': 'number',
    'employee': 'employee', 'employe': 'employee',
    'employees': 'employees', 'employes': 'employees',
    'service': 'service', 'servis': 'service',
    'warranty': 'warranty', 'waranty': 'warranty',
    'proposal': 'proposal', 'proposel': 'proposal',
    'annual': 'annual', 'anual': 'annual',
    'carpool': 'car-pool', 'car pool': 'car-pool',
    'interpersonal': 'interpersonal', 'inter personel': 'interpersonal',
    'attention': 'attention', 'atension': 'attention',
    'approve': 'approve', 'aproove': 'approve',
    'could': 'could', 'cud': 'could',
    'would': 'would', 'wud': 'would',
    'should': 'should', 'shud': 'should',
    'please': 'please', 'plese': 'please',
    'tonight': 'tonight', 'tonite': 'tonight',
    'abroad': 'abroad', 'abrod': 'abroad',
    'pursue': 'pursue', 'persue': 'pursue',
    'dreams': 'dreams', 'dreems': 'dreams',
    'laid': 'laid', 'layed': 'laid',
    'pandemic': 'pandemic', 'pandamic': 'pandemic',
    'extend': 'extend', 'extand': 'extend',
    'expires': 'expires', 'expire': 'expires',
    'discuss': 'discuss', 'discuse': 'discuss',
    'signed': 'signed', 'sined': 'signed',
    'hives': 'hires', 'hires': 'hires',
    'course': 'course', 'cors': 'course',
    'skills': 'skills', 'skils': 'skills',
    'happen': 'happen', 'hapen': 'happen',
    'happening': 'happening', 'hapening': 'happening',
    'around': 'around', 'aroun': 'around',
    'over': 'over', 'ovar': 'over'
  };

  const repaired = userWords.map(w => {
    const cleanW = w.toLowerCase().replace(/[^a-z0-9']/g, '');

    // 1. Direct accent map
    if (accentMap[cleanW]) {
      // Prefer the mapped form if it appears in the target, otherwise still use it
      const mapped = accentMap[cleanW];
      if (targetWords.includes(mapped) || targetWords.some(t => t.includes(mapped))) {
        return mapped;
      }
    }

    // 2. Exact or near match against target words
    for (const tw of targetWords) {
      if (cleanW === tw) return tw;
      if (tw.endsWith('ed') && tw.slice(0, -2) === cleanW) return tw;
      if (tw.endsWith('d') && tw.slice(0, -1) === cleanW) return tw;
      if (tw.endsWith('s') && tw.slice(0, -1) === cleanW) return tw;
      if (tw.endsWith('ing') && tw.slice(0, -3) === cleanW) return tw;
      if (tw.endsWith('es') && tw.slice(0, -2) === cleanW) return tw;

      // Fuzzy length-based match
      if (cleanW.length >= 3 && tw.length >= 3 && Math.abs(cleanW.length - tw.length) <= 2) {
        if (lcs(cleanW, tw) >= Math.max(cleanW.length, tw.length) - 2) return tw;
      }
    }

    // 3. Fall back to accent map even if not in target
    if (accentMap[cleanW]) return accentMap[cleanW];

    return w;
  });

  return repaired.join(' ');
}

let V = [], voiceUS = null, voiceGB = null;

function loadVoices() {
  try {
    if (!window.speechSynthesis) return;
    V = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    voiceGB = V.find(v => /en-GB/i.test(v.lang) && /george|hazel|susan|uk|british/i.test(v.name)) ||
              V.find(v => /en-GB/i.test(v.lang)) || V.find(v => /en-AU/i.test(v.lang));
    voiceUS = V.find(v => /en-US/i.test(v.lang) && /david|zira|mark|us|american/i.test(v.name)) ||
              V.find(v => /en-US/i.test(v.lang)) || V[0];
  } catch (e) {}
}

let globalAudioCtx = null;
function getAudioContext() {
  if (!globalAudioCtx) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) globalAudioCtx = new AudioCtx();
  }
  if (globalAudioCtx && globalAudioCtx.state === 'suspended') {
    globalAudioCtx.resume();
  }
  return globalAudioCtx;
}

function playCueTone(token) {
  return new Promise(resolve => {
    if (token !== currentSessionToken) return resolve();
    try {
      const actx = getAudioContext();
      if (!actx) return resolve();

      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, actx.currentTime);
      gain.gain.setValueAtTime(0.18, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.35);

      setTimeout(() => {
        if (token === currentSessionToken) resolve();
      }, 380);
    } catch (e) {
      resolve();
    }
  });
}

function speakText(text, isBritish, pitch = 1, rate = 0.95, token) {
  return new Promise(resolve => {
    if (!window.speechSynthesis || token !== currentSessionToken) return resolve();
    if (speechSynthesis.paused) speechSynthesis.resume();

    const u = new SpeechSynthesisUtterance(text);
    const chosenVoice = isBritish ? (voiceGB || voiceUS) : (voiceUS || voiceGB);
    if (chosenVoice) {
      u.voice = chosenVoice;
      u.lang = chosenVoice.lang;
    } else {
      u.lang = isBritish ? 'en-GB' : 'en-US';
    }
    u.pitch = isBritish ? (pitch * 1.06) : (pitch * 0.94);
    u.rate = rate;

    let timer = setTimeout(resolve, 14000);
    u.onend = () => { clearTimeout(timer); resolve(); };
    u.onerror = () => { clearTimeout(timer); resolve(); };

    speechSynthesis.speak(u);
  });
}

const wait = ms => new Promise(r => setTimeout(r, ms));

async function playTaskAudio(part, data, i, token) {
  await wait(300);
  if (token !== currentSessionToken) return;

  const isBritish = (i % 2 === 1);

  if (part === 'A' || part === 'E') {
    await speakText(data, isBritish, 1, part === 'E' ? 0.92 : 0.95, token);
  } else if (part === 'B') {
    for (const chunk of data[0]) {
      if (token !== currentSessionToken) return;
      await speakText(chunk, isBritish, 1, 0.95, token);
      await wait(500);
      if (token !== currentSessionToken) return;
    }
  } else if (part === 'C') {
    const [lines, q] = data;
    for (let k = 0; k < lines.length; k++) {
      if (token !== currentSessionToken) return;
      const speakerIsUK = (k % 2 === 1);
      const pitch = speakerIsUK ? 1.15 : 0.92;
      await speakText(lines[k], speakerIsUK, pitch, 0.95, token);
      await wait(350);
      if (token !== currentSessionToken) return;
    }
    if (token !== currentSessionToken) return;
    await speakText("Question. " + q, false, 1, 0.95, token);
  }
}

// -------------------------------------------------------------
// RELIABLE SPEECH RECOGNITION LIFECYCLE ENGINE  (FIXED v4)
// Continuous listening + strong anti-duplication + clean UI
// -------------------------------------------------------------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function stopActiveRecording() {
  if (currentRecInstance) {
    try {
      currentRecInstance.onresult = null;
      currentRecInstance.onerror = null;
      currentRecInstance.onend = null;
      currentRecInstance.abort();
    } catch (e) {}
    currentRecInstance = null;
  }
  if ($('recind')) $('recind').classList.remove('live');
}

// Remove consecutive repeated words / short phrases
function dedupeTranscript(text) {
  if (!text) return '';
  // Remove immediate word repeats: "hello hello world" → "hello world"
  let cleaned = text.replace(/\b(\w+)(?:\s+\1\b)+/gi, '$1');
  // Remove repeated 2-word phrases: "when are when are we" → "when are we"
  cleaned = cleaned.replace(/\b(\w+\s+\w+)(?:\s+\1\b)+/gi, '$1');
  // Remove repeated 3-word phrases
  cleaned = cleaned.replace(/\b(\w+\s+\w+\s+\w+)(?:\s+\1\b)+/gi, '$1');
  return cleaned.replace(/\s+/g, ' ').trim();
}

function startTurnRecording(token) {
  stopActiveRecording();
  if (token !== currentSessionToken) return;

  if (!SR) {
    if ($('note')) $('note').textContent = 'Speech recognition not supported in this browser. Please type responses.';
    return;
  }

  try {
    const recognition = new SR();
    currentRecInstance = recognition;

    recognition.lang = 'en-IN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;

    let finalTranscript = '';
    let lastFinalRaw = '';

    recognition.onstart = () => {
      if (token !== currentSessionToken) {
        stopActiveRecording();
        return;
      }
      if ($('recind')) $('recind').classList.add('live');
      if ($('st')) $('st').textContent = 'Microphone listening... Speak now';
      if ($('note')) $('note').textContent = 'Listening... Speak now';
      meta.ts = Date.now();
    };

    recognition.onsoundstart = () => {
      if ($('note')) $('note').textContent = 'Sound detected...';
    };

    recognition.onspeechstart = () => {
      if ($('note')) $('note').textContent = 'Voice detected...';
    };

    recognition.onresult = e => {
      if (token !== currentSessionToken) return;

      let interim = '';
      meta.alternatives = [];

      for (let i = e.resultIndex; i < e.results.length; ++i) {
        const item = e.results[i];
        const transcript = (item[0] && item[0].transcript) ? item[0].transcript.trim() : '';

        for (let alt = 0; alt < item.length; alt++) {
          if (item[alt] && item[alt].transcript) {
            meta.alternatives.push(item[alt].transcript.trim());
          }
        }

        if (item.isFinal) {
          // Only accept a final if it is genuinely new
          if (transcript && transcript !== lastFinalRaw) {
            const candidate = (finalTranscript + ' ' + transcript).trim();
            const deduped = dedupeTranscript(candidate);
            // Accept only if we are making progress (not shrinking)
            if (deduped.length >= finalTranscript.length) {
              finalTranscript = deduped;
              lastFinalRaw = transcript;
            }
          }
          meta.conf = item[0].confidence;
        } else {
          interim = transcript;
        }
      }

      let combinedRaw = finalTranscript;
      if (interim) {
        const temp = (finalTranscript + ' ' + interim).trim();
        combinedRaw = dedupeTranscript(temp);
      }

      const curr = activeItems[n];
      let targetText = '';
      if (curr) {
        targetText = (curr.part === 'A') ? curr.data :
                     (curr.part === 'B' ? curr.data[1][0] :
                     (curr.part === 'C' ? curr.data[2].join(' ') : ''));
      }

      const repaired = phoneticRepair(combinedRaw, targetText);
      meta.txt = repaired;
      if ($('ans')) $('ans').value = repaired;
      if ($('note')) $('note').textContent = 'Transcribing: ' + repaired;
    };

    recognition.onerror = e => {
      if (token !== currentSessionToken) return;
      if (e.error === 'no-speech') {
        if ($('note')) $('note').textContent = 'Listening... continue speaking';
      } else if (e.error === 'audio-capture') {
        if ($('note')) $('note').textContent = 'Microphone busy or hardware unreachable. Check system settings.';
      } else if (e.error === 'network') {
        if ($('note')) $('note').textContent = 'Network issue. Keep speaking...';
      } else if (e.error !== 'aborted') {
        if ($('note')) $('note').textContent = 'Audio notice: ' + e.error;
      }
    };

    recognition.onend = () => {
      if (token === currentSessionToken &&
          $('recind') &&
          $('recind').classList.contains('live') &&
          currentRecInstance === recognition) {
        setTimeout(() => {
          if (token === currentSessionToken &&
              currentRecInstance === recognition &&
              $('recind') &&
              $('recind').classList.contains('live')) {
            try {
              recognition.start();
            } catch (err) {
              setTimeout(() => {
                if (token === currentSessionToken &&
                    currentRecInstance === recognition &&
                    $('recind') &&
                    $('recind').classList.contains('live')) {
                  try { recognition.start(); } catch (e2) {}
                }
              }, 100);
            }
          }
        }, 80);
      }
    };

    recognition.start();
  } catch (err) {
    if ($('note')) $('note').textContent = 'Mic start notice: ' + err.message;
  }
}

let meterInterval = null;

async function chkM() {
  try {
    if (meterInterval) clearInterval(meterInterval);
    if (testAudioStream) {
      testAudioStream.getTracks().forEach(t => t.stop());
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }

    micGranted = true;

    $('chk').textContent = 'Microphone verified! Speak to test volume level below:';
    $('chk').style.color = 'var(--ok)';

    const actx = getAudioContext();
    const src = actx.createMediaStreamSource(stream);
    const analyser = actx.createAnalyser();
    analyser.fftSize = 256;
    src.connect(analyser);

    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    meterInterval = setInterval(() => {
      analyser.getByteFrequencyData(dataArray);
      let sum = 0;
      for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];

      let pct = Math.min(100, Math.round((avg / 64) * 100));

    setTimeout(() => {
      if (meterInterval) clearInterval(meterInterval);
      if (testAudioStream) {
        testAudioStream.getTracks().forEach(t => t.stop());
        testAudioStream = null;
      }
      if ($('chk')) $('chk').textContent = 'Microphone verified and locked. Ready for assessment.';
      if ($('vuBox')) $('vuBox').style.display = 'none';

  } catch (e) {
    $('chk').textContent = 'Microphone blocked or not found. Please click the padlock in browser address bar and enable Microphone.';

    $('vuBox').style.display = 'none';

function mech(v) {
  const s = v.trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  if (!s.length) return 0;
  return s.filter(x => /^[A-Z]/.test(x) && /[.!?]$/.test(x)).length / s.length;
}

function matchWord(refW, userW) {
  if (refW === userW) return true;
  if (refW.endsWith('ed') && refW.slice(0, -2) === userW) return true;
  if (refW.endsWith('d') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('ed') && userW.slice(0, -2) === refW) return true;
  if (refW.endsWith('s') && refW.slice(0, -1) === userW) return true;
  if (userW.endsWith('s') && userW.slice(0, -1) === refW) return true;
  if ((refW === 'badge' && userW === 'batch') || (refW === 'batch' && userW === 'badge')) return true;
  if ((refW === 'card' && userW === 'cart') || (refW === 'cart' && userW === 'card')) return true;
  if ((refW === 'issues' && userW === 'shoes') || (refW === 'issues' && userW === 'issue')) return true;
  if (Math.abs(refW.length - userW.length) <= 1 && refW.length >= 3) {
    return (lcs(refW, userW) / Math.max(refW.length, userW.length)) >= 0.8;
  }
  return false;
}

function wordLcs(targetWords, userWords) {
  const m = targetWords.length, n = userWords.length;
  const dp = Array(m + 1).fill(0).map(() => Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (matchWord(targetWords[i - 1], userWords[j - 1])) {
        dp[i][j] = dp[i - 1][j - 1] + 1;
      } else {
        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
      }
    }
  }
  return dp[m][n];
}

function flexibleRat(targetWords, userWords) {
  const common = wordLcs(targetWords, userWords);
  return common / Math.max(targetWords.length, userWords.length, 1);
}

function flexibleBag(targetWords, userWords) {
  const c = [...userWords];
  let matches = 0;
  targetWords.forEach(tw => {
    const idx = c.findIndex(uw => matchWord(tw, uw));
    if (idx > -1) {
      c.splice(idx, 1);
      matches++;
    }
  });
  return matches / (targetWords.length || 1);
}

function scoreItem(curr, v, m) {
  const p = curr.part;
  const x = curr.data;
  m = m || {};

  const cleanAns = (v || '').trim();
  if (!cleanAns) {
    if (p === 'A' || p === 'B') return { sm: 0, vo: 0 };
    if (p === 'C') return { c: 0 };
    if (p === 'D') return { d: 0 };
    if (p === 'E') return { lis: 0, sp: 0, cap: 0, pu: 0 };
    if (p === 'F') return { cov: 0, con: 0, mech: 0, va: 0 };
  }

  const candidateTranscripts = [cleanAns];
  if (m.alternatives && Array.isArray(m.alternatives)) {
    m.alternatives.forEach(alt => {
      if (!candidateTranscripts.includes(alt)) candidateTranscripts.push(alt);
    });
  }

  if (p === 'A' || p === 'B') {
    const targetNorms = (p === 'A') ? [norm(x)] : x[1].map(norm);
    let bestSm = 0, bestVo = 0;

    candidateTranscripts.forEach(trans => {
      const userNorm = norm(trans);
      targetNorms.forEach(tNorm => {
        const sm = flexibleRat(tNorm, userNorm);
        const vo = flexibleBag(tNorm, userNorm);
        if (sm > bestSm) bestSm = sm;
        if (vo > bestVo) bestVo = vo;
      });
    });

    return {
      sm: bestSm,
      vo: bestVo
    };
  }

  if (p === 'C') {
    const isCorrect = candidateTranscripts.some(trans => {
      const transLo = trans.toLowerCase();
      const transNorm = norm(trans);
      return x[2].some(k => transNorm.includes(k) || (k.length > 2 && transLo.includes(k)));
    });
    return { c: isCorrect ? 1.0 : 0.0 };
  }

  if (p === 'D') {
    const cleaned = fix(cleanAns).toLowerCase();
    const isCorrect = x[1].some(acc => acc.toLowerCase() === cleaned);
    return { d: isCorrect ? 1.0 : 0.0 };
  }

  if (p === 'E') {
    const a = tok(x), b = tok(cleanAns);
    const pa = a.filter(t => /^[^A-Za-z0-9']/.test(t));
    const pb = b.filter(t => /^[^A-Za-z0-9']/.test(t));
    return {
      lis: flexibleBag(norm(x), norm(cleanAns)),
      sp: rat(norm(x), norm(cleanAns)),
      cap: bag(a.filter(t => /^[A-Z]/.test(t)), b),
      pu: pa.length ? (lcs(pa, pb) / Math.max(pa.length, pb.length, 1)) : 1.0
    };
  }

  const lo = cleanAns.toLowerCase(), w = norm(cleanAns);
  const targetWords = norm(x[0]);
  const cov = x[1].filter(g => g.some(k => lo.includes(k))).length / x[1].length;
  const ln = cl(w.length / Math.max(targetWords.length * 0.55, 1));
  const ss = cleanAns.split(/(?<=[.!?])\s+/).filter(Boolean);
  const lk = ss.filter(z => /\b(because|but|and|so|although|while|which|who|when|after|before|then|however|therefore)\b/i.test(z)).length / (ss.length || 1);

  return {
    cov: cov,
    con: cl(cov * 0.7 + ln * 0.3),
    mech: mech(cleanAns),
    va: 0.5 * cl(new Set(w).size / (w.length || 1) / 0.75) + 0.5 * cl(lk / 0.45)
  };
}

    ['Dictation accuracy & spelling', 'E', 'E', 'sp', 0.30],
    ['Punctuation & capitalization', 'E', 'E', 'pu', 0.15],
    ['Reconstruction content & sequence', 'F', 'F', 'con', 0.30],
    ['Grammar & mechanics', 'F', 'F', 'mech', 0.15],
    ['Vocabulary variety', 'F', 'F', 'va', 0.10]
  ]
};

const band = o => o < 32 ? 'A1' : o < 43 ? 'A2' : o < 56 ? 'B1' : o < 68 ? 'B2' : o < 78 ? 'C1' : 'C2';
const toGSE = s => Math.round(10 + ((s - 20) / 60) * 80);

function calculateVersantScore(pct) {
  if (pct <= 0.02) return 20;
  if (pct >= 0.98) return 80;
  return Math.round(20 + 60 * pct);
}

function lcs(a,b){const d=Array(a.length+1).fill(0).map(()=>Array(b.length+1).fill(0));for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);return d[a.length][b.length]}
const rat=(a,b)=>lcs(a,b)/Math.max(a.length,b.length,1);
const cl=x=>Math.max(0,Math.min(1,x));
const bag=(t,r)=>{const c=[...r];let k=0;t.forEach(w=>{const i=c.indexOf(w);if(i>-1){c.splice(i,1);k++}});return k/(t.length||1)};
function gauge(label,val){const sco = val == null ? 20 : calculateVersantScore(val); return `<tr><td>${label}</td><td><strong>${sco}</strong> / 80 (${Math.round((val||0)*100)}%)</td></tr>`}

function finish() {
  currentSessionToken++;
  clearInterval(tm);
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  stopActiveRecording();

  try {
    const it = { A: [], B: [], C: [], D: [], E: [], F: [] };
    let rv = '';

    activeItems.forEach((curr, k) => {
      const v = ans[k] || '';
      const o = scoreItem(curr, v, mt[k]);
      it[curr.part].push(o);

      let targetDisplay = '';
      if (curr.part === 'A' || curr.part === 'E') {
        targetDisplay = typeof curr.data === 'string' ? curr.data : '';
      } else if (curr.part === 'B') {
        targetDisplay = (curr.data && curr.data[1] && curr.data[1][0]) ? curr.data[1][0] : '';
      } else if (curr.part === 'C') {
        targetDisplay = (curr.data && curr.data[1]) ? (curr.data[1] + ' → ' + (curr.data[2] || []).join('/')) : '';
      } else if (curr.part === 'D') {
        targetDisplay = (curr.data && curr.data[0]) ? (curr.data[0] + ' → ' + (curr.data[1] || []).join('/')) : '';
      } else if (curr.part === 'F') {
        targetDisplay = (curr.data && curr.data[0]) ? curr.data[0] : '';
      }

      const scorePct = Object.values(o).map(z => Math.round((z || 0) * 100) + '%').join(' / ');
      rv += `<tr><td>${curr.part}${k + 1}</td><td>${esc(v || '(blank)')}</td><td>${esc(targetDisplay)}</td><td>${scorePct}</td></tr>`;
    });

    const av = (ps, key) => {
      const z = ps.flatMap(p => (it[p] || []).map(o => o[key])).filter(z => z != null);
      return z.length ? z.reduce((a, b) => a + b, 0) / z.length : null;
    };

    let cards = '', skillPct = {}, subscores = {}, totalScore = 0;
    for (const s in K_SKILLS) {
      const rows = K_SKILLS[s].map(r => ({ l: r[0], f: r[1], w: r[4], v: av(r[2].split(''), r[3]) }));
      const ok = rows.filter(r => r.v != null);
      const rawPct = ok.length ? ok.reduce((a, r) => a + (r.v || 0) * r.w, 0) / (ok.reduce((a, r) => a + r.w, 0) || 1) : 0;
      
      const sco = calculateVersantScore(rawPct);
      skillPct[s] = rawPct;
      subscores[s] = sco;
      totalScore += sco;

      cards += `
        <div class="panel">
          <div class="part-hd"><b>${s}</b><span class="badge">${sco} / 80 &nbsp;·&nbsp; GSE: ${toGSE(sco)}/90 &nbsp;·&nbsp; ${band(sco)}</span></div>
          <table><tr><th>Sub-skill</th><th>Score</th></tr>${rows.map(r => gauge(r.l, r.v)).join('')}</table>
        </div>
      `;
    }

    const partDirectScores = {};
    for (const p of ['A','B','C','D','E','F']) {
      if (!it[p] || !it[p].length) continue;
      let pPct = 0;
      if (p === 'A' || p === 'B') {
        const sm = av([p], 'sm') || 0, vo = av([p], 'vo') || 0;
        pPct = (sm * 0.65) + (vo * 0.35);
      } else if (p === 'C') {
        pPct = av(['C'], 'c') || 0;
      } else if (p === 'D') {
        pPct = av(['D'], 'd') || 0;
      } else if (p === 'E') {
        const sp = av(['E'], 'sp') || 0, lis = av(['E'], 'lis') || 0, pu = av(['E'], 'pu') || 0;
        pPct = (sp * 0.45) + (lis * 0.40) + (pu * 0.15);
      } else if (p === 'F') {
        const cov = av(['F'], 'cov') || 0, con = av(['F'], 'con') || 0, mech = av(['F'], 'mech') || 0;
        pPct = (cov * 0.40) + (con * 0.40) + (mech * 0.20);
      }
      partDirectScores[p] = calculateVersantScore(pPct);
    }

    let partSummaryRows = Object.keys(partDirectScores).map(p => {
      return `<tr><td>Part ${p} — ${T_CONFIG[p][0]}</td><td>${it[p].length} Items</td><td><strong>${partDirectScores[p]}</strong> / 80</td></tr>`;
    }).join('');

    const O = isNaN(totalScore) ? 20 : Math.round(totalScore / 4);

    let lsrw = '';
    for (const s2 in K_SKILLS) {
      const sco = subscores[s2] || 20;
      lsrw += `
        <div class="skill-card">
          <div class="sk-name">${s2}</div>
          <div class="sk-num">${sco}<span style="font-size:.9rem;color:var(--mut)"> / 80</span></div>
          <div class="sk-bar"><i style="width:${Math.round(100 * (sco - 20) / 60)}%"></i></div>
          <div class="mut" style="margin-top:4px">GSE: ${toGSE(sco)} · ${band(sco)}</div>
        </div>
      `;
    }

    $('app').innerHTML = `
      <div class="score-hd">
        <div class="lbl">Assessment Overall Score</div>
        <div class="num">${O}</div>
        <div class="lbl">out of 80 &nbsp;·&nbsp; ${band(O)}</div>
        <div class="score-sub">Global Scale of English (GSE): ${toGSE(O)} / 90</div>
      </div>
      <div class="lsrw">${lsrw}</div>

      <div class="panel">
        <div class="part-hd"><b>Section-by-Section Scores (Direct 20–80 Scale)</b><span>Performance by Part</span></div>
        <table>
          <tr><th>Section</th><th>Length</th><th>Direct Score</th></tr>
          ${partSummaryRows}
        </table>
      </div>

      <div class="panel"><details open><summary>Core Skill Diagnostics</summary><div style="margin-top:12px">${cards}</div></details></div>
      <div class="panel"><details><summary>Review Item Audit (${activeItems.length} total)</summary><div style="overflow-x:auto;margin-top:10px"><table><tr><th>Item</th><th>Your Answer</th><th>Target</th><th>Item Accuracy</th></tr>${rv}</table></div></details></div>
      <div class="btnrow" style="margin:16px">
        <button onclick="window.print()">Print Score Report (PDF)</button>
        <button class="pri" onclick="intro()">Return to Home</button>
      </div>
    `;
  } catch(err) {
    console.error("Scorecard error:", err);
    if ($('app')) {$('app').innerHTML = `<div class="panel"><div class="part-hd"><b>Test Completed</b><span>Results Summary</span></div><p>Your test has concluded successfully, but the scorecard could not render.</p><div class="btnrow"><button class="pri" onclick="intro()">Return to Home</button></div></div>`;
    }
  }
}

try {
  intro();
} catch (e) {
  if (document.getElementById('app')) {
    document.getElementById('app').innerHTML = `<div class="panel" style="color:var(--red)"><b>Critical Error loading test:</b> ${e.message}</div>`;
  }
}
</script>
</body>
</html>
